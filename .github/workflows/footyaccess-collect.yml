name: MLS NEXT Garden State results and standings
# Manual-only since the nightly "Nightly official MLS NEXT update" job refreshes
# results, standings and the Golden Boot every night. Run from Actions → Run workflow.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: garden-state-site-update
  cancel-in-progress: false
  queue: max
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select Eastern cron occurrence (tolerates delayed starts)
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [[ "$EVENT_NAME" != "schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            node --input-type=module -e "import {isScheduledWindow} from './scripts/update-standings.mjs'; console.log('run='+isScheduledWindow(process.env.EVENT_SCHEDULE))" >> "$GITHUB_OUTPUT"
          fi
      - name: Test validation, rank history, and Eastern schedule gate
        if: steps.window.outputs.run == 'true'
        run: node --test scripts/update-standings.test.mjs
      - name: Fetch official MLS NEXT Academy Division schedule
        if: steps.window.outputs.run == 'true'
        run: |
          mkdir -p schedule-output
          curl --fail --show-error --location --retry 3 --max-time 120 'https://mls-assist.theintelligenceplatform.com/data/schedule/mls-next-2-academy-division-26-27.json' --output schedule-output/source-feed.json
      - name: Validate feed and rebuild both ages atomically
        if: steps.window.outputs.run == 'true'
        run: node scripts/update-standings.mjs --feed schedule-output/source-feed.json
      - name: Rebuild search-friendly pages, sitemap and robots.txt
        if: steps.window.outputs.run == 'true'
        run: node scripts/build-seo-pages.mjs
      - name: Install browser for publication checks
        if: steps.window.outputs.run == 'true'
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify mobile page, scoring coverage, tabs, and club views
        if: steps.window.outputs.run == 'true'
        run: node scripts/smoke-site.mjs
      - name: Publish successfully checked results and standings
        if: steps.window.outputs.run == 'true'
        run: |
          if [[ -z "$(git status --porcelain -- index.html garden-state/ conferences/ sitemap.xml robots.txt)" ]]; then
            echo "No results-page changes to publish."
            exit 0
          fi
          git config user.name "garden-state-stats-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html garden-state/ conferences/ sitemap.xml robots.txt
          git commit -m "Refresh Garden State results and standings from official MLS NEXT schedule"
          git push origin HEAD:main
      - name: Preserve source, reconciliation report, and browser evidence
        if: always() && steps.window.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mls-next-schedule-audit
          path: schedule-output/
          retention-days: 30
