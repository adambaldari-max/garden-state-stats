name: Nightly official MLS NEXT update
# Refreshes results, kickoff times and fields for every U13/U14 Academy Division
# conference plus all U13/U14 Homegrown conferences from the official MLS NEXT feeds, then rebuilds the Garden State Golden Boot
# from FootyAccess match reports. Commits only when something changed.
on:
  workflow_dispatch:
  schedule:
    - cron: '15 8 * * *'   # every night, about 4:15 AM Eastern (3:15 AM in winter)
    - cron: '0 0 * * 0,1'  # Saturday and Sunday evenings, about 8 PM Eastern, to catch weekend results sooner
permissions:
  contents: write
  pages: write
concurrency:
  group: garden-state-site-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pull official MLS NEXT schedule and standings
        run: node scripts/official-update.mjs
      - name: Validate and refresh Homegrown U13 and U14
        run: |
          node --test scripts/homegrown-update.test.mjs
          node scripts/homegrown-update.mjs
          node scripts/homegrown-scorers.mjs
      - name: Rebuild Garden State Golden Boot from match reports
        run: node scripts/golden-boot-update.mjs
      - name: Rebuild search-friendly pages, sitemap and robots.txt
        run: node scripts/build-seo-pages.mjs
      - name: Check the updated page in a phone-sized browser before publishing
        run: |
          mkdir -p schedule-output
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node scripts/smoke-site.mjs
      - name: Commit changes
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- index.html data/ garden-state/ conferences/ homegrown/ sitemap.xml robots.txt)" ]]; then
            echo "No changes since the last update."
            exit 0
          fi
          git config user.name "garden-state-stats-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/ garden-state/ conferences/ homegrown/ sitemap.xml robots.txt
          git commit -m "Nightly official MLS NEXT data update"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
        id: commit
      - name: Republish the site
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Pages rebuild request not accepted; the push will still publish on the next build."
