name: Website interface checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - scripts/smoke-site.mjs
      - scripts/homegrown*.mjs
      - data/homegrown-*.json
      - .github/workflows/site-interface-checks.yml
permissions:
  contents: read
concurrency:
  group: garden-state-interface-checks
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Homegrown feed and scorer contracts
        run: node --test scripts/homegrown-update.test.mjs
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Check mobile interactions and exported graphics
        run: |
          mkdir -p schedule-output
          node scripts/smoke-site.mjs
      - name: Keep mobile and graphic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-interface-evidence
          path: schedule-output/
          retention-days: 14
